name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go test
        run: go test ./...

  frontend-user:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend_user/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build

  frontend-anchor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_anchor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend_anchor/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
